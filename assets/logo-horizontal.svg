<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="violetTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="origamiViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="origamiIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#2e1fb8" />
    </linearGradient>
  </defs>
  <!-- Origami Bird Emblem -->
  <g transform="translate(4, 7) scale(0.39)">
    <!-- Wing (Back) -->
    <polygon points="2,4 69,4 69,70" fill="url(#origamiViolet)"/>
    <!-- Tail -->
    <polygon points="36,126 69,94 69,126" fill="url(#origamiViolet)"/>
    <!-- Body -->
    <polygon points="69,4 135,66 69,126" fill="url(#origamiIndigo)"/>
    <!-- Head / Neck -->
    <polygon points="103,35 140,4 140,24 135,66" fill="url(#origamiViolet)"/>
    <!-- Beak -->
    <polygon points="140,4 158,24 140,24" fill="url(#origamiIndigo)"/>
  </g>
  <!-- Brand Typography (Stacked matching FinalLogo.jpeg) -->
  <text x="74" y="30" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.02em" fill="#0d0b1e">Bhuvix</text>
  <text x="74" y="53" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.02em" fill="url(#violetTextGrad)">Technology</text>
</svg>
