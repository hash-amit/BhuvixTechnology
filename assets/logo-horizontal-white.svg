<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="violetTextGradW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="origamiVioletW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="origamiIndigoW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <!-- Origami Bird Emblem -->
  <g transform="translate(4, 7) scale(0.39)">
    <!-- Wing (Back) -->
    <polygon points="2,4 69,4 69,70" fill="url(#origamiVioletW)"/>
    <!-- Tail -->
    <polygon points="36,126 69,94 69,126" fill="url(#origamiVioletW)"/>
    <!-- Body -->
    <polygon points="69,4 135,66 69,126" fill="url(#origamiIndigoW)"/>
    <!-- Head / Neck -->
    <polygon points="103,35 140,4 140,24 135,66" fill="url(#origamiVioletW)"/>
    <!-- Beak -->
    <polygon points="140,4 158,24 140,24" fill="url(#origamiIndigoW)"/>
  </g>
  <!-- Brand Typography (Stacked White matching FinalLogo.jpeg) -->
  <text x="74" y="30" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.02em" fill="#ffffff">Bhuvix</text>
  <text x="74" y="53" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.02em" fill="url(#violetTextGradW)">Technology</text>
</svg>
