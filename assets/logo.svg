<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="violetBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="origamiViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="origamiIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#2e1fb8" />
    </linearGradient>
  </defs>
  <!-- Cosmic Badge Background -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#0d0b1e" stroke="url(#violetBorderGrad)" stroke-width="2.5"/>
  <!-- Origami Bird Icon (Scaled & Centered) -->
  <g transform="translate(17, 21) scale(0.42)">
    <!-- Wing (Back) -->
    <polygon points="2,4 69,4 69,70" fill="url(#origamiViolet)"/>
    <!-- Tail -->
    <polygon points="36,126 69,94 69,126" fill="url(#origamiViolet)"/>
    <!-- Body -->
    <polygon points="69,4 135,66 69,126" fill="url(#origamiIndigo)"/>
    <!-- Head / Neck -->
    <polygon points="103,35 140,4 140,24 135,66" fill="url(#origamiViolet)"/>
    <!-- Beak -->
    <polygon points="140,4 158,24 140,24" fill="url(#origamiIndigo)"/>
  </g>
</svg>
